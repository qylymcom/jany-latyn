<html lang="ky">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint; otherwise daisyUI follows the OS preference.
      try {
        var t = localStorage.getItem('jany_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="min-h-screen bg-base-100 text-base-content">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
