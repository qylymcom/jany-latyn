<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1498" font-family="Georgia, 'Times New Roman', serif" font-size="18">
<text x="30" y="34" font-size="22" font-weight="bold">jany-latyn — alphabet reference</text>
<text x="30" y="70" font-weight="bold">Cyrillic</text><text x="120" y="70" font-weight="bold">jany-latyn</text><text x="230" y="70" font-weight="bold">ASCII</text><text x="330" y="70" font-weight="bold">example</text>
<text x="30" y="98" font-weight="bold">Core alphabet</text>
<text x="30" y="126">А/а</text><text x="120" y="126">A/a</text><text x="230" y="126">a</text>
<text x="30" y="154">Б/б</text><text x="120" y="154">B/b</text><text x="230" y="154">b</text>
<text x="30" y="182">Г/г</text><text x="120" y="182">G/g</text><text x="230" y="182">g</text>
<text x="30" y="210">Д/д</text><text x="120" y="210">D/d</text><text x="230" y="210">d</text>
<text x="30" y="238">Е/е</text><text x="120" y="238">E/e</text><text x="230" y="238">e</text>
<text x="30" y="266">Ж/ж</text><text x="120" y="266">J/j</text><text x="230" y="266">j</text>
<text x="30" y="294">З/з</text><text x="120" y="294">Z/z</text><text x="230" y="294">z</text>
<text x="30" y="322">И/и</text><text x="120" y="322">I/i</text><text x="230" y="322">i</text>
<text x="30" y="350">Й/й</text><text x="120" y="350">Í/í</text><text x="230" y="350">i</text><text x="330" y="350" font-size="14">aí (ай — moon)</text>
<text x="30" y="378">К/к</text><text x="120" y="378">K/k</text><text x="230" y="378">k</text>
<text x="30" y="406">Л/л</text><text x="120" y="406">L/l</text><text x="230" y="406">l</text>
<text x="30" y="434">М/м</text><text x="120" y="434">M/m</text><text x="230" y="434">m</text>
<text x="30" y="462">Н/н</text><text x="120" y="462">N/n</text><text x="230" y="462">n</text>
<text x="30" y="490">Ң/ң</text><text x="120" y="490">Ŋ/ŋ</text><text x="230" y="490">n</text><text x="330" y="490" font-size="14">jaŋy (жаңы — new)</text>
<text x="30" y="518">О/о</text><text x="120" y="518">O/o</text><text x="230" y="518">o</text>
<text x="30" y="546">Ө/ө</text><text x="120" y="546">Ö/ö</text><text x="230" y="546">o</text><text x="330" y="546" font-size="14">köl (көл — lake)</text>
<text x="30" y="574">П/п</text><text x="120" y="574">P/p</text><text x="230" y="574">p</text>
<text x="30" y="602">Р/р</text><text x="120" y="602">R/r</text><text x="230" y="602">r</text>
<text x="30" y="630">С/с</text><text x="120" y="630">S/s</text><text x="230" y="630">s</text>
<text x="30" y="658">Т/т</text><text x="120" y="658">T/t</text><text x="230" y="658">t</text>
<text x="30" y="686">У/у</text><text x="120" y="686">U/u</text><text x="230" y="686">u</text>
<text x="30" y="714">Ү/ү</text><text x="120" y="714">Ü/ü</text><text x="230" y="714">u</text><text x="330" y="714" font-size="14">küz (күз — autumn)</text>
<text x="30" y="742">Х/х</text><text x="120" y="742">H/h</text><text x="230" y="742">h</text><text x="330" y="742" font-size="14">rahmat (рахмат — thanks)</text>
<text x="30" y="770">Ч/ч</text><text x="120" y="770">Ç/ç</text><text x="230" y="770">c</text><text x="330" y="770" font-size="14">çaí (чай — tea)</text>
<text x="30" y="798">Ш/ш</text><text x="120" y="798">Ş/ş</text><text x="230" y="798">s</text><text x="330" y="798" font-size="14">şaar (шаар — city)</text>
<text x="30" y="826">Ы/ы</text><text x="120" y="826">Y/y</text><text x="230" y="826">y</text><text x="330" y="826" font-size="14">kyrgyz (кыргыз — Kyrgyz)</text>
<text x="30" y="854">Э/э</text><text x="120" y="854">E/e</text><text x="230" y="854">e</text>
<text x="30" y="882" font-weight="bold">Loan letters (Russian loans only)</text>
<text x="30" y="910">В/в</text><text x="120" y="910">V/v</text><text x="230" y="910">v</text>
<text x="30" y="938">Ё/ё</text><text x="120" y="938">Ío/ío</text><text x="230" y="938">ío</text><text x="330" y="938" font-size="14">íolka (ёлка — loan)</text>
<text x="30" y="966">Ф/ф</text><text x="120" y="966">F/f</text><text x="230" y="966">f</text>
<text x="30" y="994">Ц/ц</text><text x="120" y="994">Ts/ts</text><text x="230" y="994">ts</text>
<text x="30" y="1022">Щ/щ</text><text x="120" y="1022">Ş/ş</text><text x="230" y="1022">s</text><text x="330" y="1022" font-size="14">íaşik (ящик — loan, merged with ş)</text>
<text x="30" y="1050">Ъ/ъ</text><text x="120" y="1050">—</text><text x="230" y="1050">—</text><text x="330" y="1050" font-size="14">obíekt (объект — absorbed by í (obíekt))</text>
<text x="30" y="1078">Ь/ь</text><text x="120" y="1078">—</text><text x="230" y="1078">—</text><text x="330" y="1078" font-size="14">semía (семья — absorbed by í (semía))</text>
<text x="30" y="1106">Ю/ю</text><text x="120" y="1106">Íu/íu</text><text x="230" y="1106">íu</text><text x="330" y="1106" font-size="14">iíul (июль — loan)</text>
<text x="30" y="1134">Я/я</text><text x="120" y="1134">Ía/ía</text><text x="230" y="1134">ía</text><text x="330" y="1134" font-size="14">íama (яма — loan)</text>
<text x="30" y="1162" font-size="14">ж in Russian loans is pronounced [ʒ] (zh-like) but always written j</text>
<text x="30" y="1218" font-weight="bold">Long vowels (doubled letter)</text>
<text x="30" y="1246">Аа/аа</text><text x="120" y="1246">aa</text><text x="230" y="1246">aa</text><text x="330" y="1246" font-size="14">talaalar (талаалар — valleys)</text>
<text x="30" y="1274">Ээ/ээ</text><text x="120" y="1274">ee</text><text x="230" y="1274">ee</text><text x="330" y="1274" font-size="14">eegi (ээги — his jaw/chin (Manas), керээз (testament))</text>
<text x="30" y="1302">Ии/ии</text><text x="120" y="1302">ii</text><text x="230" y="1302">ii</text><text x="330" y="1302" font-size="14">—</text>
<text x="30" y="1330">Оо/оо</text><text x="120" y="1330">oo</text><text x="230" y="1330">oo</text><text x="330" y="1330" font-size="14">zoolor (зоолор — cliffs)</text>
<text x="30" y="1358">Уу/уу</text><text x="120" y="1358">uu</text><text x="230" y="1358">uu</text><text x="330" y="1358" font-size="14">kuuş (кууш — башы кууш (Manas portrait))</text>
<text x="30" y="1386">Ыы/ыы</text><text x="120" y="1386">yy</text><text x="230" y="1386">yy</text><text x="330" y="1386" font-size="14">—</text>
<text x="30" y="1414">Өө/өө</text><text x="120" y="1414">öö</text><text x="230" y="1414">oo</text><text x="330" y="1414" font-size="14">jölöör (жөлөөр — will lean on)</text>
<text x="30" y="1442">Үү/үү</text><text x="120" y="1442">üü</text><text x="230" y="1442">uu</text><text x="330" y="1442" font-size="14">jügürüü (жүгүрүү — running)</text>
</svg>
